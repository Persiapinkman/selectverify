[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selectverify"
version = "0.1.0"
description = "Select, Then Verify: Budgeted Failure Attribution for Tool-Using Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
inference = ["torch==2.8.0", "transformers==4.57.6", "accelerate>=1.0,<2"]
benchmark = ["pyyaml>=6,<7", "pillow>=10,<12"]
test = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
selectverify = "selectverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
selectverify = ["assets/*.json", "assets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
